name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: Luotsi.sln
  CLI_PROJECT: Luotsi.Cli/Luotsi.Cli.csproj
  BUILD_CONFIGURATION: Release

jobs:
  validate:
    name: Validate solution
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json

      - name: SDK diagnostics
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION --locked-mode /bl:artifacts/binlogs/restore.binlog

      - name: Build
        shell: pwsh
        run: >
          dotnet build $env:SOLUTION
          --configuration $env:BUILD_CONFIGURATION
          --no-restore
          --warnaserror
          /bl:artifacts/binlogs/build.binlog

      - name: Test
        shell: pwsh
        run: >
          dotnet test $env:SOLUTION
          --configuration $env:BUILD_CONFIGURATION
          --no-build
          --logger "trx;LogFilePrefix=luotsi-tests"
          --logger "console;verbosity=detailed"
          --results-directory artifacts/test-results
          --collect "XPlat Code Coverage"
          --blame-hang
          --blame-hang-timeout 2m

      - name: Summarize validation
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Validation"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- Configuration: ``$env:BUILD_CONFIGURATION``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Solution: ``$env:SOLUTION``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Test result files: ``artifacts/test-results``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- MSBuild binlogs: ``artifacts/binlogs``"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Upload MSBuild binlogs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binlogs
          path: artifacts/binlogs
          if-no-files-found: ignore

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive_ext: zip
          - rid: linux-x64
            archive_ext: tar.gz
          - rid: osx-x64
            archive_ext: tar.gz
          - rid: osx-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json

      - name: Verify locked restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION --locked-mode /bl:artifacts/binlogs/publish-restore-${{ matrix.rid }}.binlog

      - name: Publish CLI
        shell: pwsh
        run: >
          dotnet publish $env:CLI_PROJECT
          --configuration $env:BUILD_CONFIGURATION
          -p:PublishRid=${{ matrix.rid }}
          --no-restore
          --output artifacts/publish/${{ matrix.rid }}
          /bl:artifacts/binlogs/publish-${{ matrix.rid }}.binlog

      - name: Smoke published binary
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: artifacts/publish/win-x64/Luotsi.Cli.exe --help

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          $rid = '${{ matrix.rid }}'
          $source = "artifacts/publish/$rid"
          if ('${{ matrix.archive_ext }}' -eq 'zip') {
            Compress-Archive -Path "$source/*" -DestinationPath "artifacts/packages/luotsi-cli-$rid.zip" -Force
          } else {
            tar -czf "artifacts/packages/luotsi-cli-$rid.tar.gz" -C $source .
          }

      - name: Summarize publish
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Published ${{ matrix.rid }}"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Get-ChildItem artifacts/packages | ForEach-Object {
            Add-Content $env:GITHUB_STEP_SUMMARY "- ``$($_.Name)`` ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }

      - name: Upload packaged CLI
        uses: actions/upload-artifact@v4
        with:
          name: luotsi-cli-${{ matrix.rid }}
          path: artifacts/packages/luotsi-cli-${{ matrix.rid }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload publish binlog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-binlog-${{ matrix.rid }}
          path: |
            artifacts/binlogs/publish-restore-${{ matrix.rid }}.binlog
            artifacts/binlogs/publish-${{ matrix.rid }}.binlog
          if-no-files-found: ignore

  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - validate
      - publish
    if: always()
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          if [[ "${{ needs.validate.result }}" != "success" || "${{ needs.publish.result }}" != "success" ]]; then
            echo "CI failed: validate=${{ needs.validate.result }}, publish=${{ needs.publish.result }}"
            exit 1
          fi
          echo "CI passed."
