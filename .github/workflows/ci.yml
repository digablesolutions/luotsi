name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: Luotsi.sln
  CLI_PROJECT: Luotsi.Cli/Luotsi.Cli.csproj
  BUILD_CONFIGURATION: Release

jobs:
  validate:
    name: Validate solution
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json
            NuGet.config

      - name: SDK diagnostics
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION --locked-mode /bl:artifacts/binlogs/restore.binlog

      - name: Build
        shell: pwsh
        run: >
          dotnet build $env:SOLUTION
          --configuration $env:BUILD_CONFIGURATION
          --no-restore
          --warnaserror
          /bl:artifacts/binlogs/build.binlog

      - name: Test
        shell: pwsh
        run: >
          dotnet test $env:SOLUTION
          --configuration $env:BUILD_CONFIGURATION
          --no-build
          --logger "trx;LogFilePrefix=luotsi-tests"
          --logger "console;verbosity=detailed"
          --results-directory artifacts/test-results
          --collect "XPlat Code Coverage"
          --blame-hang
          --blame-hang-timeout 2m

      - name: Generate coverage report
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $coverageFiles = Get-ChildItem -LiteralPath artifacts/test-results -Recurse -Filter coverage.cobertura.xml -File -ErrorAction SilentlyContinue
          if ($coverageFiles.Count -eq 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "## Coverage"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "No Cobertura coverage files were produced."
            exit 0
          }

          dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./.tools --version 5.5.10
          $reports = ($coverageFiles | ForEach-Object { $_.FullName }) -join ";"
          & ./.tools/reportgenerator.exe "-reports:$reports" "-targetdir:artifacts/coverage-report" "-reporttypes:Html;MarkdownSummaryGithub" "-verbosity:Warning"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $summary = Get-ChildItem -LiteralPath artifacts/coverage-report -Filter *.md -File -ErrorAction SilentlyContinue | Select-Object -First 1
          Add-Content $env:GITHUB_STEP_SUMMARY "## Coverage"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          if ($null -eq $summary) {
            Add-Content $env:GITHUB_STEP_SUMMARY "Coverage report was generated under ``artifacts/coverage-report``."
          } else {
            Get-Content -LiteralPath $summary.FullName | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Summarize validation
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Validation"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- Configuration: ``$env:BUILD_CONFIGURATION``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Solution: ``$env:SOLUTION``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Test result files: ``artifacts/test-results``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- MSBuild binlogs: ``artifacts/binlogs``"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: artifacts/coverage-report
          if-no-files-found: ignore

      - name: Upload MSBuild binlogs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msbuild-binlogs
          path: artifacts/binlogs
          if-no-files-found: ignore

  website:
    name: Validate website
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Validate website
        working-directory: website
        run: npm run check

      - name: Build website
        working-directory: website
        run: npm run build

  android-helper:
    name: Build Android view helper
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Android helper APK
        shell: pwsh
        run: |
          $wrapper = ".\Luotsi.ViewServer.Android\gradlew.bat"
          $arguments = @("--no-daemon", "-p", "Luotsi.ViewServer.Android", ":app:assembleRelease")
          $maxAttempts = 3
          $exitCode = 0

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            & $wrapper @arguments
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              exit $exitCode
            }

            $delaySeconds = 20 * $attempt
            Write-Warning "Android helper build failed with exit code $exitCode. Retrying in $delaySeconds seconds ($attempt/$maxAttempts)."
            Start-Sleep -Seconds $delaySeconds
          }

          $apk = "Luotsi.ViewServer.Android/app/build/outputs/apk/release/app-release.apk"
          if (!(Test-Path -LiteralPath $apk)) {
            throw "Android view helper release APK was not produced at $apk."
          }

      - name: Upload Android helper APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-helper-apk
          path: Luotsi.ViewServer.Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    needs:
      - validate
      - android-helper
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive_ext: zip
            stage_ffmpeg: true
          - rid: linux-x64
            archive_ext: tar.gz
            stage_ffmpeg: true
          - rid: osx-x64
            archive_ext: tar.gz
            stage_ffmpeg: false
          - rid: osx-arm64
            archive_ext: tar.gz
            stage_ffmpeg: false

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json
            NuGet.config

      - name: Verify locked restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION --locked-mode /bl:artifacts/binlogs/publish-restore-${{ matrix.rid }}.binlog

      - name: Download Android view helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-helper-apk
          path: Luotsi.ViewServer.Android/app/build/outputs/apk/release

      - name: Verify Android view helper
        shell: pwsh
        run: |
          $helper = "Luotsi.ViewServer.Android/app/build/outputs/apk/release/app-release.apk"
          if (!(Test-Path -LiteralPath $helper)) {
            throw "Downloaded Android view helper APK is missing: $helper"
          }

      - name: Stage FFmpeg native libraries
        if: ${{ matrix.stage_ffmpeg == true }}
        shell: pwsh
        run: >
          ./ffmpeg/download-ffmpeg.ps1
          -Platform ${{ matrix.rid }}
          -Force

      - name: Publish CLI
        shell: pwsh
        run: >
          dotnet publish $env:CLI_PROJECT
          --configuration $env:BUILD_CONFIGURATION
          -p:PublishRid=${{ matrix.rid }}
          --no-restore
          --output artifacts/publish/${{ matrix.rid }}
          /bl:artifacts/binlogs/publish-${{ matrix.rid }}.binlog

      - name: Smoke published binary
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: artifacts/publish/win-x64/luotsi.exe --help

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          $rid = '${{ matrix.rid }}'
          $source = "artifacts/publish/$rid"
          if ('${{ matrix.archive_ext }}' -eq 'zip') {
            Compress-Archive -Path "$source/*" -DestinationPath "artifacts/packages/luotsi-cli-$rid.zip" -Force
          } else {
            tar -czf "artifacts/packages/luotsi-cli-$rid.tar.gz" -C $source .
          }

      - name: Summarize publish
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Published ${{ matrix.rid }}"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Get-ChildItem artifacts/packages | ForEach-Object {
            Add-Content $env:GITHUB_STEP_SUMMARY "- ``$($_.Name)`` ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }

      - name: Upload packaged CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: luotsi-cli-${{ matrix.rid }}
          path: artifacts/packages/luotsi-cli-${{ matrix.rid }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload publish binlog
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-binlog-${{ matrix.rid }}
          path: |
            artifacts/binlogs/publish-restore-${{ matrix.rid }}.binlog
            artifacts/binlogs/publish-${{ matrix.rid }}.binlog
          if-no-files-found: ignore

  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - validate
      - website
      - android-helper
      - publish
    if: always()
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          if [[ "${{ needs.validate.result }}" != "success" || "${{ needs.website.result }}" != "success" || "${{ needs.android-helper.result }}" != "success" || "${{ needs.publish.result }}" != "success" ]]; then
            echo "CI failed: validate=${{ needs.validate.result }}, website=${{ needs.website.result }}, android-helper=${{ needs.android-helper.result }}, publish=${{ needs.publish.result }}"
            exit 1
          fi
          echo "CI passed."
