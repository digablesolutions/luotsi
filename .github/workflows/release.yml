name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.2.3"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: Luotsi.sln
  CLI_PROJECT: Luotsi.Cli/Luotsi.Cli.csproj
  BUILD_CONFIGURATION: Release

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-rc.1; got '$tag'."
            exit 1
          fi

          version="${tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          core_version="${version%%-*}"
          IFS='.' read -r major minor patch <<< "$core_version"
          android_version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$android_version_code" >> "$GITHUB_OUTPUT"

      - name: Verify tag is on default branch
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git fetch origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          tag_commit="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "Tag $TAG points at $tag_commit, which is not reachable from origin/$DEFAULT_BRANCH."
            exit 1
          fi

  validate:
    name: Validate source
    runs-on: windows-latest
    needs: validate-tag
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json
            NuGet.config

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION --locked-mode /bl:artifacts/binlogs/release-restore.binlog

      - name: Build
        shell: pwsh
        run: >
          dotnet build $env:SOLUTION
          --configuration $env:BUILD_CONFIGURATION
          --no-restore
          --warnaserror
          /p:ContinuousIntegrationBuild=true
          /p:Version=${{ needs.validate-tag.outputs.version }}
          /bl:artifacts/binlogs/release-build.binlog

      - name: Test
        shell: pwsh
        run: >
          dotnet test $env:SOLUTION
          --configuration $env:BUILD_CONFIGURATION
          --no-build
          --logger "trx;LogFilePrefix=release-tests"
          --results-directory artifacts/test-results
          --collect "XPlat Code Coverage"
          --blame-hang
          --blame-hang-timeout 2m

      - name: Generate coverage report
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $coverageFiles = Get-ChildItem -LiteralPath artifacts/test-results -Recurse -Filter coverage.cobertura.xml -File -ErrorAction SilentlyContinue
          if ($coverageFiles.Count -eq 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "## Coverage"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "No Cobertura coverage files were produced."
            exit 0
          }

          dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./.tools --version 5.5.10
          $reports = ($coverageFiles | ForEach-Object { $_.FullName }) -join ";"
          & ./.tools/reportgenerator.exe "-reports:$reports" "-targetdir:artifacts/coverage-report" "-reporttypes:Html;MarkdownSummaryGithub" "-verbosity:Warning"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $summary = Get-ChildItem -LiteralPath artifacts/coverage-report -Filter *.md -File -ErrorAction SilentlyContinue | Select-Object -First 1
          Add-Content $env:GITHUB_STEP_SUMMARY "## Coverage"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          if ($null -eq $summary) {
            Add-Content $env:GITHUB_STEP_SUMMARY "Coverage report was generated under ``artifacts/coverage-report``."
          } else {
            Get-Content -LiteralPath $summary.FullName | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-validation-diagnostics
          path: |
            artifacts/binlogs
            artifacts/test-results
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-coverage-report
          path: artifacts/coverage-report
          if-no-files-found: ignore

  android-helper:
    name: Build Android view helper
    runs-on: windows-latest
    needs: validate-tag
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build signed Android helper APK
        shell: pwsh
        env:
          LUOTSI_ANDROID_KEYSTORE_BASE64: ${{ secrets.LUOTSI_ANDROID_KEYSTORE_BASE64 }}
          LUOTSI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LUOTSI_ANDROID_KEYSTORE_PASSWORD }}
          LUOTSI_ANDROID_KEY_ALIAS: ${{ secrets.LUOTSI_ANDROID_KEY_ALIAS }}
          LUOTSI_ANDROID_KEY_PASSWORD: ${{ secrets.LUOTSI_ANDROID_KEY_PASSWORD }}
          LUOTSI_ANDROID_VERSION_NAME: ${{ needs.validate-tag.outputs.version }}
          LUOTSI_ANDROID_VERSION_CODE: ${{ needs.validate-tag.outputs.android_version_code }}
        run: |
          $required = @(
            "LUOTSI_ANDROID_KEYSTORE_BASE64",
            "LUOTSI_ANDROID_KEYSTORE_PASSWORD",
            "LUOTSI_ANDROID_KEY_ALIAS",
            "LUOTSI_ANDROID_KEY_PASSWORD"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Release packaging requires Android signing secrets: $($missing -join ', ')"
          }

          $keystore = Join-Path $env:RUNNER_TEMP "luotsi-view-helper-release.jks"
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:LUOTSI_ANDROID_KEYSTORE_BASE64))
          $env:LUOTSI_ANDROID_KEYSTORE_PATH = $keystore
          Write-Host "Using Luotsi Android release signing key from GitHub secrets."
          Write-Host "Stamping Android helper version $env:LUOTSI_ANDROID_VERSION_NAME ($env:LUOTSI_ANDROID_VERSION_CODE)."

          $wrapper = ".\Luotsi.ViewServer.Android\gradlew.bat"
          $arguments = @("--no-daemon", "-p", "Luotsi.ViewServer.Android", ":app:assembleRelease")
          $maxAttempts = 3
          $exitCode = 0

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            & $wrapper @arguments
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              exit $exitCode
            }

            $delaySeconds = 20 * $attempt
            Write-Warning "Android helper build failed with exit code $exitCode. Retrying in $delaySeconds seconds ($attempt/$maxAttempts)."
            Start-Sleep -Seconds $delaySeconds
          }

          $releaseApkDir = Join-Path $PWD "Luotsi.ViewServer.Android/app/build/outputs/apk/release"
          $canonicalApk = Join-Path $releaseApkDir "app-release.apk"
          if (!(Test-Path -LiteralPath $canonicalApk)) {
            $candidate = Get-ChildItem -LiteralPath $releaseApkDir -Filter "*.apk" -File -ErrorAction SilentlyContinue |
              Sort-Object Name |
              Select-Object -First 1
            if ($null -eq $candidate) {
              throw "Android view helper release APK was not produced under $releaseApkDir."
            }

            Copy-Item -LiteralPath $candidate.FullName -Destination $canonicalApk -Force
            Write-Host "Normalized Android helper APK $($candidate.Name) to app-release.apk."
          }

          Get-ChildItem -LiteralPath $releaseApkDir | ForEach-Object {
            Write-Host "Android helper output: $($_.FullName)"
          }

      - name: Upload Android helper APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-helper-apk
          path: Luotsi.ViewServer.Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    needs:
      - validate-tag
      - validate
      - android-helper
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive_ext: zip
            runner: windows-latest
          - rid: linux-x64
            archive_ext: tar.gz
            runner: ubuntu-latest
          - rid: osx-x64
            archive_ext: tar.gz
            runner: ubuntu-latest
          - rid: osx-arm64
            archive_ext: tar.gz
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json
            NuGet.config

      - name: Verify locked restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION --locked-mode /bl:artifacts/binlogs/release-publish-restore-${{ matrix.rid }}.binlog

      - name: Download Android view helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-helper-apk
          path: Luotsi.ViewServer.Android/app/build/outputs/apk/release

      - name: Verify Android view helper
        shell: pwsh
        run: |
          $helper = "Luotsi.ViewServer.Android/app/build/outputs/apk/release/app-release.apk"
          if (!(Test-Path -LiteralPath $helper)) {
            throw "Downloaded Android view helper APK is missing: $helper"
          }

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish $env:CLI_PROJECT
          --configuration $env:BUILD_CONFIGURATION
          -p:PublishRid=${{ matrix.rid }}
          --no-restore
          --output artifacts/publish/${{ matrix.rid }}
          /p:ContinuousIntegrationBuild=true
          /p:Version=${{ needs.validate-tag.outputs.version }}
          /bl:artifacts/binlogs/release-publish-${{ matrix.rid }}.binlog

      - name: Verify helper APK was packaged
        shell: pwsh
        run: |
          $helper = "artifacts/publish/${{ matrix.rid }}/Luotsi.ViewServer.Android/app/build/outputs/apk/release/app-release.apk"
          if (!(Test-Path -LiteralPath $helper)) {
            $publishRoot = "artifacts/publish/${{ matrix.rid }}"
            $candidate = Get-ChildItem -LiteralPath $publishRoot -Recurse -File |
              Where-Object { $_.Name -like "*app-release.apk" } |
              Sort-Object FullName |
              Select-Object -First 1
            if ($null -eq $candidate) {
              $builtHelper = "Luotsi.ViewServer.Android/app/build/outputs/apk/release/app-release.apk"
              if (Test-Path -LiteralPath $builtHelper) {
                $candidate = Get-Item -LiteralPath $builtHelper
              }
            }

            if ($null -eq $candidate) {
              Get-ChildItem -LiteralPath $publishRoot -Recurse -File | ForEach-Object {
                Write-Host "Published file: $($_.FullName)"
              }
              throw "Published Luotsi bundle is missing the Android view helper APK: $helper"
            }

            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $helper) | Out-Null
            Copy-Item -LiteralPath $candidate.FullName -Destination $helper -Force
            Write-Host "Normalized published Android helper APK $($candidate.FullName) to $helper."
          }

      - name: Verify helper APK signature
        shell: pwsh
        env:
          LUOTSI_ANDROID_CERT_SHA256: ${{ secrets.LUOTSI_ANDROID_CERT_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LUOTSI_ANDROID_CERT_SHA256)) {
            throw "Release packaging requires LUOTSI_ANDROID_CERT_SHA256 to verify the Android helper signing certificate."
          }

          $helper = "artifacts/publish/${{ matrix.rid }}/Luotsi.ViewServer.Android/app/build/outputs/apk/release/app-release.apk"
          $buildToolsRoot = Join-Path $env:ANDROID_HOME "build-tools"
          $apksignerName = if ($IsWindows) { "apksigner.bat" } else { "apksigner" }
          $apksigner = Get-ChildItem -Path $buildToolsRoot -Filter $apksignerName -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $apksigner) {
            throw "Android SDK apksigner was not found under $buildToolsRoot."
          }

          $output = & $apksigner.FullName verify --print-certs $helper 2>&1
          if ($LASTEXITCODE -ne 0) {
            $output | ForEach-Object { Write-Host $_ }
            throw "Android helper APK signature verification failed."
          }

          $actual = ($output | Select-String -Pattern "SHA-256 digest:" | Select-Object -First 1).Line
          if ([string]::IsNullOrWhiteSpace($actual)) {
            $output | ForEach-Object { Write-Host $_ }
            throw "Could not read Android helper signing certificate SHA-256 digest."
          }

          $actual = ($actual -replace ".*SHA-256 digest:\s*", "").Trim().Replace(":", "").ToLowerInvariant()
          $expected = $env:LUOTSI_ANDROID_CERT_SHA256.Trim().Replace(":", "").ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Android helper signing certificate mismatch. Expected $expected but got $actual."
          }

          Write-Host "Android helper signing certificate verified: $actual"

      - name: Normalize non-Windows apphost permissions
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: chmod 755 "artifacts/publish/${{ matrix.rid }}/luotsi"

      - name: Verify non-Windows apphost permissions
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: test -x "artifacts/publish/${{ matrix.rid }}/luotsi"

      - name: Smoke published Windows binary
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: artifacts/publish/win-x64/luotsi.exe --help

      - name: Smoke published Linux binary
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: artifacts/publish/linux-x64/luotsi --help

      - name: Archive package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          $rid = '${{ matrix.rid }}'
          $version = '${{ needs.validate-tag.outputs.version }}'
          $source = "artifacts/publish/$rid"
          $baseName = "luotsi-cli-$version-$rid"

          if ('${{ matrix.archive_ext }}' -eq 'zip') {
            $archive = "artifacts/packages/$baseName.zip"
            Compress-Archive -Path "$source/*" -DestinationPath $archive -Force
          } else {
            $archive = "artifacts/packages/$baseName.tar.gz"
            tar -czf $archive -C $source .
          }

          $hash = Get-FileHash $archive -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package-${{ matrix.rid }}
          path: |
            artifacts/packages/*
          if-no-files-found: error

      - name: Upload publish binlog
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-publish-binlog-${{ matrix.rid }}
          path: |
            artifacts/binlogs/release-publish-restore-${{ matrix.rid }}.binlog
            artifacts/binlogs/release-publish-${{ matrix.rid }}.binlog
          if-no-files-found: ignore

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - validate
      - package
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Stage installer scripts
        shell: bash
        run: |
          cp scripts/install.ps1 release-assets/luotsi-install.ps1
          cp scripts/install.sh release-assets/luotsi-install.sh

      - name: Build checksum manifest
        shell: bash
        run: |
          cd release-assets
          while IFS= read -r -d '' file; do
            asset_name="$(basename "$file")"
            asset_hash="$(sha256sum "$file" | awk '{print tolower($1)}')"
            printf '%s  %s\n' "$asset_hash" "$asset_name"
          done < <(find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.ps1" -o -name "*.sh" \) -print0 | sort -z) > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve handwritten release intro
        id: release_intro
        shell: bash
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          tag_file=".github/release-notes/${TAG}.md"
          stable_file=".github/release-notes/stable.md"
          prerelease_file=".github/release-notes/prerelease.md"

          if [[ -f "$tag_file" ]]; then
            echo "path=$tag_file" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ needs.validate-tag.outputs.prerelease }}" == "true" && -f "$prerelease_file" ]]; then
            echo "path=$prerelease_file" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ needs.validate-tag.outputs.prerelease }}" != "true" && -f "$stable_file" ]]; then
            echo "path=$stable_file" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.ps1
            release-assets/*.sh
            release-assets/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
          RELEASE_INTRO_PATH: ${{ steps.release_intro.outputs.path }}
        shell: bash
        run: |
          args=(
            "$TAG"
            release-assets/luotsi-cli-*
            release-assets/luotsi-install.*
            release-assets/SHA256SUMS
            --title "Luotsi $VERSION"
            --verify-tag
            --generate-notes
          )

          if [[ -n "$RELEASE_INTRO_PATH" ]]; then
            intro="$(cat "$RELEASE_INTRO_PATH")"
            args+=(--notes "$intro")
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/luotsi-cli-* release-assets/luotsi-install.* release-assets/SHA256SUMS --clobber
          else
            gh release create "${args[@]}"
          fi

      - name: Summarize release
        shell: bash
        run: |
          {
            echo "## Release ${{ needs.validate-tag.outputs.tag }}"
            echo
            echo "Published assets:"
            find release-assets -maxdepth 1 -type f -printf "- \`%f\`\n" | sort
            if [[ -n "${{ steps.release_intro.outputs.path }}" ]]; then
              echo
              echo "Handwritten release intro source: \`${{ steps.release_intro.outputs.path }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
